<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Trả Sách', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card shadow-sm p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0" th:text="'Trả Sách Cho Phiếu #' + ${borrowing.id}">Form Trả Sách</h4>
                    <a th:href="@{/borrowings/{id}(id=${borrowing.id})}" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
                </div>
                <hr>

                <div class="alert alert-warning border-0 shadow-sm d-flex align-items-center gap-2 mb-4">
                    <i class="fa-solid fa-calculator fa-lg"></i>
                    <div>
                        Phạt quá hạn: <strong>5.000 VNĐ / ngày / cuốn</strong> (nếu ngày trả hiện tại muộn hơn Hạn trả <strong><span th:text="${#temporals.format(borrowing.dueDate, 'dd/MM/yyyy')}"></span></strong>).
                        Hệ thống tự động cộng hoàn tồn kho sách ngay sau khi xác nhận trả.
                    </div>
                </div>

                <form th:action="@{/borrowings/{id}/return(id=${borrowing.id})}" th:object="${returnRequest}" method="post">
                    <input type="hidden" th:field="*{borrowingId}">

                    <h5 class="fw-bold mb-3">Nhập Số Lượng Trả Cho Từng Cuốn Sách:</h5>
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Tên Sách</th>
                                    <th class="text-center">Số Lượng Đã Mượn</th>
                                    <th class="text-center">Đã Trả Trước Đó</th>
                                    <th class="text-center" style="width: 200px;">Nhập Số Lượng Trả Đợt Này</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detail, stat : ${borrowing.details}">
                                    <td class="fw-semibold" th:text="${detail.bookTitle}">Tên sách</td>
                                    <td class="text-center fw-bold" th:text="${detail.quantity}">1</td>
                                    <td class="text-center fw-bold text-success" th:text="${detail.returnedQuantity}">0</td>
                                    <td>
                                        <!-- Hidden detailId binding -->
                                        <input type="hidden" th:name="'items[' + ${stat.index} + '].detailId'" th:value="${detail.id}">
                                        <input type="number"
                                               th:name="'items[' + ${stat.index} + '].returnQuantity'"
                                               th:value="${detail.quantity - detail.returnedQuantity}"
                                               class="form-control text-center fw-bold"
                                               min="0"
                                               th:max="${detail.quantity - detail.returnedQuantity}">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg btn-custom">
                            <i class="fa-solid fa-check-double me-1"></i> Xác Nhận Trả Sách & Tính Phạt
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
