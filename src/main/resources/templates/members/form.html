<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(${isEdit ? 'Chỉnh Sửa Thành Viên' : 'Thêm Thành Viên Mới'}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0" th:text="${isEdit ? 'Chỉnh Sửa Thành Viên' : 'Thêm Thành Viên Mới'}">Form Thành Viên</h4>
                    <a href="/members" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
                </div>
                <hr>
                <form th:action="${isEdit ? '/members/' + memberId : '/members'}" th:object="${memberForm}" method="post">
                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-semibold">Họ và Tên <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{fullName}" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn An" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Lỗi họ tên</div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Liên Hệ <span class="text-danger">*</span></label>
                        <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="an.nguyen@example.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Lỗi email</div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">Số Điện Thoại</label>
                        <input type="text" th:field="*{phone}" class="form-control" id="phone" placeholder="0901234567">
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label fw-semibold">Trạng Thái Tài Khoản</label>
                        <select th:field="*{status}" class="form-select" id="status">
                            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-custom">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Lưu Thành Viên
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
