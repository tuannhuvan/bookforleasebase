<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(${isEdit ? 'Chỉnh Sửa Sách' : 'Thêm Sách Mới'}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0" th:text="${isEdit ? 'Chỉnh Sửa Sách' : 'Thêm Sách Mới'}">Form Sách</h4>
                    <a href="/books" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
                </div>
                <hr>
                <form th:action="${isEdit ? '/books/' + bookId : '/books'}" th:object="${bookForm}" method="post">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="isbn" class="form-label fw-semibold">Mã ISBN <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{isbn}" class="form-control" id="isbn" placeholder="Ví dụ: 978-0134685991" th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}">Lỗi ISBN</div>
                        </div>

                        <div class="col-md-6">
                            <label for="categoryId" class="form-label fw-semibold">Thể Loại <span class="text-danger">*</span></label>
                            <select th:field="*{categoryId}" class="form-select" id="categoryId" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''">
                                <option value="">-- Chọn Thể Loại --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">Lỗi Thể Loại</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Tên Sách <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{title}" class="form-control" id="title" placeholder="Tên cuốn sách..." th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Lỗi tên sách</div>
                    </div>

                    <div class="mb-3">
                        <label for="author" class="form-label fw-semibold">Tác Giả <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{author}" class="form-control" id="author" placeholder="Họ tên tác giả..." th:classappend="${#fields.hasErrors('author')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">Lỗi tác giả</div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="totalQuantity" class="form-label fw-semibold">Tổng Số Lượng <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{totalQuantity}" class="form-control" id="totalQuantity" min="0" placeholder="Số lượng nhập kho" th:classappend="${#fields.hasErrors('totalQuantity')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('totalQuantity')}" th:errors="*{totalQuantity}">Lỗi số lượng</div>
                        </div>

                        <div class="col-md-6">
                            <label for="status" class="form-label fw-semibold">Trạng Thái</label>
                            <select th:field="*{status}" class="form-select" id="status">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-custom">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Lưu Sách
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
