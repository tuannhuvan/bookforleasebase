<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(${isEdit ? 'Chỉnh Sửa Thể Loại' : 'Tạo Thể Loại Mới'}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0" th:text="${isEdit ? 'Chỉnh Sửa Thể Loại' : 'Tạo Thể Loại Mới'}">Form</h4>
                    <a href="/categories" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
                </div>
                <hr>
                <form th:action="${isEdit ? '/categories/' + categoryId : '/categories'}" th:object="${categoryForm}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Tên Thể Loại <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Ví dụ: Công Nghệ Thông Tin" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Lỗi tên</div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Mô Tả</label>
                        <textarea th:field="*{description}" class="form-control" id="description" rows="3" placeholder="Mô tả chi tiết thể loại..."></textarea>
                    </div>

                    <div class="mb-3 form-check" th:if="${isEdit}">
                        <input type="checkbox" th:field="*{active}" class="form-check-input" id="active">
                        <label class="form-check-label fw-semibold" for="active">Trạng thái Kích Hoạt (Active)</label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-custom">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Lưu Thể Loại
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
