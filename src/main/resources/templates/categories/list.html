<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Quản Lý Thể Loại', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Danh Sách Thể Loại Sách</h3>
            <p class="text-muted">Quản lý các thể loại phân loại trong thư viện (Hỗ trợ Xóa Mềm)</p>
        </div>
        <a href="/categories/new" class="btn btn-primary btn-custom">
            <i class="fa-solid fa-plus me-1"></i> Thêm Thể Loại
        </a>
    </div>

    <div class="card shadow-sm p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>#ID</th>
                        <th>Tên Thể Loại</th>
                        <th>Mô Tả</th>
                        <th>Trạng Thái</th>
                        <th class="text-end">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td class="fw-bold" th:text="${cat.id}">1</td>
                        <td class="fw-semibold" th:text="${cat.name}">Tên thể loại</td>
                        <td th:text="${cat.description != null ? cat.description : '—'}">Mô tả</td>
                        <td>
                            <span th:if="${cat.active}" class="badge bg-success"><i class="fa-solid fa-check me-1"></i>Hoạt động</span>
                            <span th:unless="${cat.active}" class="badge bg-secondary"><i class="fa-solid fa-eye-slash me-1"></i>Đã xóa mềm</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/categories/{id}/edit(id=${cat.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="fa-solid fa-pen-to-square"></i> Sửa
                            </a>
                            <form th:if="${cat.active}" th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa mềm thể loại này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="fa-solid fa-trash"></i> Xóa Mềm
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="5" class="text-center text-muted py-4">Chưa có thể loại nào được tạo.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
